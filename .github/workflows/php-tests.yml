name: PHP tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-24.04

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: transcoding_ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Compose files
        run: |
          docker compose --env-file .env.example -f compose.yaml config >/tmp/compose-production.yaml
          docker compose --profile smoke --profile gpu-smoke --env-file .env.example -f compose.yaml config >/tmp/compose-smoke.yaml
          docker compose --env-file .env.example -f compose.yaml -f compose.dev.yaml config >/tmp/compose-dev.yaml

      - name: Validate smoke scripts
        run: |
          sh -n docker/production/ffmpeg-smoke.sh
          sh -n docker/production/gpu-worker-entrypoint.sh
          sh -n scripts/runtime/gpu-worker-preflight.sh
          sh -n scripts/smoke/ffmpeg-cpu-smoke.sh
          sh -n scripts/smoke/ffmpeg-gpu-smoke.sh

      - name: Run FFmpeg CPU smoke
        run: |
          docker compose --profile smoke --env-file .env.example -f compose.yaml build ffmpeg-smoke-cpu
          docker compose --profile smoke --env-file .env.example -f compose.yaml run --rm -T ffmpeg-smoke-cpu

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: curl, fileinfo, gd, intl, json, mbstring, pdo_mysql, pdo_sqlite, redis-6.0.2, sqlite3, tokenizer, xml, zip
          coverage: none

      - name: Validate composer files
        run: composer validate --no-check-publish

      - name: Check framework upgrade baseline
        run: php scripts/upgrade/framework_stage1_check.php

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan package:discover --ansi
          php artisan key:generate --ansi
          mkdir -p storage/app/public/uploaded storage/app/public/converted storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views bootstrap/cache
          chmod -R ug+rwx storage bootstrap/cache

      - name: Validate production PHP Redis runtime
        run: |
          docker compose --env-file .env -f compose.yaml build app
          docker compose --env-file .env -f compose.yaml run --rm -T --no-deps --entrypoint php app -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); exit(extension_loaded("redis") && phpversion("redis") === "6.0.2" && is_int(config("queue.connections.redis.block_for")) ? 0 : 1);'

      - name: Build production GPU worker runtime
        run: docker compose --env-file .env -f compose.yaml build worker-video-gpu

      - name: Validate production GPU worker capabilities
        run: |
          docker run --rm --entrypoint sh transcoding-webservice-worker-gpu:local -lc '
            php -r '\''exit(extension_loaded("redis") && phpversion("redis") === "6.0.2" ? 0 : 1);'\''
            /opt/ffmpeg/bin/ffmpeg -hide_banner -version | head -n 1 | grep -q "ffmpeg version 6.1.1"
            /opt/ffmpeg/bin/ffmpeg -hide_banner -encoders 2>/dev/null | grep -q h264_nvenc
            /opt/ffmpeg/bin/ffmpeg -hide_banner -filters 2>/dev/null | grep -q scale_cuda
            /opt/ffmpeg/bin/ffmpeg -hide_banner -hwaccels 2>/dev/null | grep -qx cuda
          '

      - name: Validate MySQL clean-install migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: transcoding_ci
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate:fresh --force

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Run Redis queue integration tests
        env:
          RUN_REDIS_INTEGRATION: 1
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: vendor/bin/phpunit tests/Feature/RedisQueueIntegrationTest.php
